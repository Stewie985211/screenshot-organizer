name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Configure project caches
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE '.cache'
          New-Item -ItemType Directory -Path (Join-Path $cache 'temp') -Force | Out-Null
          "TEMP=$(Join-Path $cache 'temp')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$(Join-Path $cache 'temp')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Prepare FFmpeg for video tests
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
            $env:Path += ';C:\ProgramData\chocolatey\bin'
          }
          (Split-Path (Get-Command ffmpeg).Source) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Split-Path (Get-Command ffprobe).Source) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          ffmpeg -version
          ffprobe -version
      - name: Test file operations
        run: pnpm test
      - name: Build renderer and main process
        run: pnpm build
